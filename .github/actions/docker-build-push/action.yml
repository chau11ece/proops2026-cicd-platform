name: "Docker Build and Push"
description: "Build a Docker image and optionally push to GHCR, gated by push input"

inputs:
  image-name:
    description: "Full image name without tag (e.g. proops2026-taskmanager/task-service)"
    required: true
  image-tag:
    description: "Image tag — use github.sha for traceability"
    required: true
  context:
    description: "Docker build context path"
    required: false
    default: "."
  push:
    description: "Push to registry (true on merge to main, false on PR)"
    required: false
    default: "false"
  registry-username:
    description: "Registry username (github.actor)"
    required: false
    default: ""
  registry-password:
    description: "Registry token (secrets.GITHUB_TOKEN)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        push: ${{ inputs.push }}
        tags: ghcr.io/${{ inputs.image-name }}:${{ inputs.image-tag }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
