name: Reusable Deploy

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Commit SHA to deploy — copy from a reusable-build run summary"
        type: string
        required: true
      environment:
        description: "Target environment: dev | staging | prod (used as kubectl namespace)"
        type: string
        required: true
      project-name:
        description: "GitHub org/project name (e.g. proops2026-taskmanager)"
        type: string
        required: true
      service-name:
        description: "K8s deployment name and GHCR image name"
        type: string
        required: true
    secrets:
      KUBE_CONFIG_DATA:
        description: "Base64-encoded kubeconfig — passed via secrets: inherit from caller repo"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # NOTE: environment: intentionally omitted here.
    # GitHub does not inject env-level secrets into reusable workflow jobs via secrets: inherit
    # because the calling job (uses:) cannot declare environment: simultaneously.
    # Namespace isolation is achieved via kubectl -n ${{ inputs.environment }}.

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "Kubeconfig server: $(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"

      - name: Deploy ${{ inputs.environment }} (image @${{ inputs.image-tag }})
        run: |
          kubectl -n ${{ inputs.environment }} set image \
            deployment/${{ inputs.service-name }} \
            ${{ inputs.service-name }}=ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}:${{ inputs.image-tag }}
          kubectl -n ${{ inputs.environment }} rollout status \
            deployment/${{ inputs.service-name }} --timeout=180s

      - name: Verify deployed image
        run: |
          kubectl -n ${{ inputs.environment }} describe pod \
            -l app=${{ inputs.service-name }} | grep -E "Image:|Status:"
