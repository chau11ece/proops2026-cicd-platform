name: Reusable App CI

on:
  workflow_call:
    inputs:
      push:
        description: "Push image to GHCR (true on merge to main, false on PR)"
        type: boolean
        required: false
        default: false
      image-name:
        description: "Image name without tag (e.g. proops2026-taskmanager/task-service)"
        type: string
        required: true
      node-version:
        description: "Node.js version"
        type: string
        required: false
        default: "20"
      working-directory:
        description: "Directory containing package.json"
        type: string
        required: false
        default: "."
      context:
        description: "Docker build context path (defaults to working-directory)"
        type: string
        required: false
        default: "."
    secrets:
      GHCR_TOKEN:
        description: "GitHub token with packages:write scope"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ inputs.context }}/Dockerfile
          failure-threshold: error

      - name: Build and test
        uses: chau11ece/proops2026-cicd-platform/.github/actions/build-app@v1
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Dependency audit (npm audit)
        working-directory: ${{ inputs.working-directory }}
        run: npm audit --audit-level=high || true

      - name: Security scan (Trivy filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: Build and push Docker image
        uses: chau11ece/proops2026-cicd-platform/.github/actions/docker-build-push@v1
        with:
          image-name: ${{ inputs.image-name }}
          image-tag: ${{ github.sha }}
          context: ${{ inputs.context }}
          push: ${{ inputs.push }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GHCR_TOKEN }}
